name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.14' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.14' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.14' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.14' }}

            Bản cập nhật v1.0.14 mang đến bộ công cụ tiện ích hệ thống và âm báo sạc thông minh:
            - 🗣️ **Âm báo sạc bằng giọng nói Tiếng Việt thông minh:**
              - Tự động phát âm thanh/giọng nói tiếng Việt khi cắm sạc (đọc công suất W, % pin), rút sạc, nhắc nhở khi sạc đạt 80% để bảo vệ tuổi thọ pin, sạc đầy 100%, hoặc cảnh báo khi pin quá nóng (> 42°C).
              - Nút nghe thử giọng nói trực quan ngay trong tab Pin & Sạc.
            - ⚡ **Ép tần số quét màn hình (Force Refresh Rate):**
              - Khóa cứng tần số quét 60Hz / 90Hz / 120Hz / 144Hz chống tụt FPS xuống 60Hz khi xem YouTube, Google Maps hoặc khi máy ấm.
            - 🚀 **Tối ưu RAM & Mở Game Turbo Xiaomi 1 chạm:**
              - Hiển thị dung lượng RAM đã dùng / trống theo thời gian thực.
              - Dọn dẹp cache và tiến trình thừa giúp máy nhẹ và mượt mà hơn.
              - Khởi chạy nhanh Không gian trò chơi Game Turbo chính gốc MIUI/HyperOS.
            - 🧹 **Dọn rác chuyên sâu MIUI (Deep Clean No-Ads):**
              - Mở thẳng module dọn dẹp hệ thống Xiaomi để xóa rác lớn, file tạm Zalo, Facebook mà không bị dính quảng cáo.
            - 🛠️ **Menu kiểm tra phần cứng ẩn Xiaomi & Chu kỳ sạc:**
              - Mở giao diện CIT Hardware Test (`*#*#6484#*#*`).
              - Hiển thị số chu kỳ sạc pin (Battery Cycle Count) và mở menu bí mật (`*#*#6485#*#*`).
            - 🚫 **Tắt dịch vụ quảng cáo ngầm Xiaomi (MSA Disabler):**
              - Lối tắt nhanh vào trang Cài đặt để tắt tiến trình quảng cáo ngầm `msa` và dịch vụ theo dõi quảng cáo cá nhân hóa.
            - 🏷️ **Tên file phát hành:** `Mi-Tool-v1.0.14-Release.apk`.
            - 🔄 **In-App Updater:** Tự động nhận diện bản mới v1.0.14 và cho phép nâng cấp trực tiếp trong app.

            ### 📦 Tải về:
            - **Mi-Tool-v1.0.14-Release.apk**: Bản phát hành chính thức đã ký số (~1.98 MB).
            - **Mi-Tool-v1.0.14-Debug.apk**: Bản thử nghiệm.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
