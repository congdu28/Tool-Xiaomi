name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.43}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ⚡ Nhận Diện Chuẩn Xác Vi Xử Lý (CPU / SoC) & Nhà Cung Cấp:
              1. Hiển thị rõ ràng Nhà cung cấp (Qualcomm Technologies, MediaTek...), Vi xử lý chính thức (Snapdragon 8 Elite Gen 5, Snapdragon 8 Elite, Snapdragon 8 Gen 2/3...) và Mã chip/Platform (SM8850, SM8750, SM8550 kalama...).
              2. Khắc phục triệt để hiển thị nhập nhằng "(gen4/5)" trước đây.
            - 🔋 Chuẩn Hóa Dung Lượng Pin Thực Tế & Chu Kỳ Sạc:
              1. Bổ sung đọc trực tiếp từ HyperOS Battery Service (`dumpsys battery` ASOC & cycle count) qua Shizuku.
              2. Tích hợp sâu các node CIT/BMS sysfs của Xiaomi và tối ưu hóa bộ nhớ đệm (Cache) chống gián đoạn.
            - ⏱️ Nâng Cấp Toàn Diện Widget SOT & Tùy Biến:
              1. 3 phong cách widget mới: Chuẩn HyperOS Kính mờ, Tối giản (Minimalist), Bảng điều khiển (Full Dashboard).
              2. Nhận diện thích ứng tự động theo Theme hệ thống (Sáng/Tối) hoặc tùy chỉnh cố định.
              3. Bổ sung nút bấm nhỏ cập nhật thông số tức thì có phản hồi rung nhẹ (Haptic).
              4. Tự động cập nhật định kỳ (15p, 30p, 60p hoặc theo sự kiện màn hình/sạc).
              5. Tích hợp BottomSheet tùy biến widget trực tiếp ngay trong tab Pin & Sạc.
            - 🚀 Xuất xưởng duy nhất 1 bản Release APK chuẩn tối ưu.
          files: output-apks/*.apk
