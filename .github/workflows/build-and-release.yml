name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.12' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.12' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.12' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.12' }}

            Bản cập nhật v1.0.12 tối ưu hóa hiển thị sạc màn hình khóa và tự động xóa thông báo khi rút sạc:
            - 🔒 **Tối ưu hiển thị thông báo ngoài Màn hình khóa Xiaomi:** 
              - Khởi tạo Notification Channel mới với mức ưu tiên cao (`IMPORTANCE_HIGH`), hiển thị công khai (`VISIBILITY_PUBLIC`), hoàn toàn im lặng (silent, không kêu bíp mỗi giây).
              - Tương thích 100% với màn hình khóa Xiaomi HyperOS & MIUI, giải quyết tình trạng thông báo bị ẩn ngoài màn hình khóa.
            - ⚡ **Tự động xóa sạch thông báo khi rút sạc:** 
              - Khi cắm sạc: Tự động kích hoạt hiển thị thông số sạc thời gian thực (Giờ giây, %, Công suất W, Nhiệt độ °C, Thời gian dự kiến sạc đầy).
              - Khi rút sạc: Tự động xóa sạch thông báo ngay lập tức (`dismissAndStop`), trả lại màn hình khóa sạch sẽ.
            - 🏷️ **Tên file phát hành:** `Mi-Tool-v1.0.12-Release.apk`.
            - 🔄 **In-App Updater:** Tự động nhận diện bản mới v1.0.12 và cho phép nâng cấp trực tiếp trong app.

            ### 📦 Tải về:
            - **Mi-Tool-v1.0.12-Release.apk**: Bản phát hành chính thức đã ký số (~1.96 MB).
            - **Mi-Tool-v1.0.12-Debug.apk**: Bản thử nghiệm.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
