name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.31}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 🎨 Tối Ưu Responsive Giao Diện App Hao Pin:
              1. Thay thế nút "Dừng" bằng nút icon Close (✕) nhỏ gọn chuẩn 32x32dp, mở rộng tối đa không gian cho thông số. Khi dừng thành công, icon tự động chuyển sang tích xanh tròn (✓).
              2. Sửa lỗi badge % pin bị rớt dòng lộn xộn (thêm singleLine, maxLines=1, rút gọn nhãn hiển thị thành ~X.X% siêu gọn gàng).
            - ⏱️ Khắc Phục Triệt Để Mâu Thuẫn SOT & Lần Rút Sạc:
              1. Chặn đứng lỗi fallback sang UsageStats cả ngày khi vừa rút sạc, đảm bảo SOT từ lúc rút sạc luôn bắt đầu từ 0 và khớp chuẩn 100% với thời gian dùng máy.
              2. Xóa bỏ số ảo ở tab rút sạc khi pin chưa tụt 1% nào (hiển thị ~0%).
            - 🚀 Xuất Xưởng Bản Release Duy Nhất: Chỉ đóng gói duy nhất 1 bản Release tối ưu, tốc độ tải và build cực nhanh.
          files: |
            output-apks/Mi-Tool-*-Release.apk
