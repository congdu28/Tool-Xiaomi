name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.48}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ✨ **Tối Ưu & Tái Cấu Trúc Toàn Diện Giao Diện Khắc Phục Thông Báo**:
              1. 🎨 Khắc phục triệt để lỗi huy hiệu (badge) bị ép co dọc chữ; chuyển sang huy hiệu bo góc bán trong suốt hiện đại đặt trên dòng riêng biệt.
              2. 🔘 Thay thế CheckBox thô bằng MaterialCheckBox thanh lịch, hỗ trợ chạm vào toàn bộ hàng thẻ để chọn/bỏ chọn cực kỳ mượt mà.
              3. 🛡️ Sửa lỗi icon Shizuku hiển thị mâu thuẫn giữa trạng thái đã cấp quyền (xanh) và chưa cấp quyền (cam), bổ sung nút cấp quyền trực tiếp ngay trên thẻ.
              4. 📊 Bổ sung bộ đếm thời gian thực: hiển thị rõ số lượng ứng dụng đã chọn (ví dụ: Đã chọn 8/12).
              5. ⚡ Cập nhật trạng thái trực tiếp ngay trên giao diện sau khi tối ưu hóa 1-chạm mà không đóng hộp thoại đột ngột.
            - 🔋 **Tối Ưu Hóa Logic Hoạt Động & Chống Hao Pin Thông Minh**:
              1. Phân loại thông minh: Mặc định chọn các ứng dụng quan trọng (Google GMS, GSF, Gmail, Toàn bộ App Ngân hàng Việt Nam, Zalo, Messenger, Telegram...).
              2. Bỏ chọn mặc định đối với các ứng dụng mua sắm & mạng xã hội video (Shopee, Lazada, TikTok...) để ngăn chặn việc chạy ngầm không cần thiết gây tốn pin.
              3. Làm rõ cơ chế FCM Push Hub: Người dùng KHÔNG CẦN khóa đa nhiệm (Lock Recents), giải phóng RAM và tiết kiệm pin tối đa.
            - 🚀 Xuất xưởng Release APK v1.0.48 tối ưu hóa cao nhất.
          files: output-apks/*.apk
