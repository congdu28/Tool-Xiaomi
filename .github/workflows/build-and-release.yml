name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.53}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 🔝 **Tối Ưu Vị Trí Tab Tính Năng & Cài Đặt**:
              1. Đưa thẻ "Khắc phục trễ thông báo" lên vị trí **ĐẦU TIÊN** trong Tab Tính Năng (Tools) để người dùng truy cập ngay lập tức.
              2. Đưa thẻ "Cập nhật ứng dụng" lên vị trí **ĐẦU TIÊN** trong Tab Cài Đặt (Settings), hỗ trợ kiểm tra và xem trạng thái cập nhật nhanh chóng.
            - 📱 **Mở Rộng Không Giới Hạn: Chọn Bất Cứ Ứng Dụng Nào Trên Máy**:
              1. Loại bỏ giới hạn danh sách 12 app: Hệ thống tự động quét và nạp **toàn bộ 100% ứng dụng** đã cài đặt trên máy người dùng.
              2. 🔍 Tích hợp **Thanh tìm kiếm thời gian thực** (Real-time Search) tìm nhanh theo tên app hoặc tên gói (package).
              3. 🏷️ Bộ lọc thông minh 4 chế độ: `Tất cả`, `⭐ Khuyên dùng`, `Đã chọn`, `⚠️ Chưa tối ưu`.
              4. ⚡ Cơ chế tải danh sách bất đồng bộ ngầm siêu tốc, chuyển động 120Hz mượt mà tuyệt đối không bị đơ lag.
            - 🚀 Xuất xưởng Release APK v1.0.49 tối ưu hóa hoàn hảo.
          files: output-apks/*.apk
