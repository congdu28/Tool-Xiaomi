name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.10' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.10' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.10' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.10' }}

            Bản cập nhật v1.0.10 bổ sung hiển thị sạc ngoài màn hình khóa và tối ưu kết nối ADB cho Xiaomi:
            - 🔒 **Hiển thị thông số sạc ngoài Màn hình khóa:** 
              - **Ghim thông báo sạc khóa (Lockscreen Notification):** Tự động ghim thời gian sạc đầy, công suất W, % pin và nhiệt độ hiển thị công khai ngay ngoài màn hình khóa khi cắm sạc.
              - **Màn hình sạc khóa AMOLED chuyên dụng:** Tự động sáng màn hình hiển thị đồng hồ giây, vòng tròn pin, công suất sạc và đếm ngược thời gian đầy theo phong cách hiện đại.
              - **Phím tắt cài đặt khóa Xiaomi:** Nút điều hướng vào thẳng cài đặt thông báo màn hình khóa của HyperOS để bật hiển thị đầy đủ nội dung.
            - 📋 **Luôn hiển thị hộp lệnh ADB & Lưu ý đặc thù Xiaomi:** 
              - Hộp lệnh `adb shell pm grant ...` và nút sao chép luôn hiển thị cố định, không bị ẩn.
              - Hướng dẫn chi tiết cách bật "Gỡ lỗi USB (Cài đặt bảo mật)" trên Xiaomi (cần SIM/Mi Account) để khắc phục lỗi Xiaomi chặn kết nối ADB/Shizuku.
            - 🏷️ **Tên file phát hành:** `Mi-Tool-v1.0.10-Release.apk`.
            - 🔄 **In-App Updater:** Tự động nhận diện bản mới v1.0.10 và cho phép tải, nâng cấp trực tiếp trong app.

            ### 📦 Tải về:
            - **Mi-Tool-v1.0.10-Release.apk**: Bản phát hành chính thức đã ký số.
            - **Mi-Tool-v1.0.10-Debug.apk**: Bản thử nghiệm.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
