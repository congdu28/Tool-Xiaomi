name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.29}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 🚀 Tối Ưu Lõi Dọn Dẹp RAM & Shizuku Deep Boost: Giải phóng RAM thực tế (loại bỏ hoàn toàn số ảo ngẫu nhiên). Hỗ trợ dọn dẹp cấp hệ thống chuyên sâu qua Shizuku (am kill-all & pm trim-caches). Thống kê chính xác số MB thực tế thu hồi và số tiến trình đã đóng.
            - 📱 Nâng Cấp Giao Diện RAM & Tab Pin: Thiết kế lại toàn diện BottomSheet RAM theo chuẩn Xiaomi HyperOS với 3 khối số liệu (Used / Free / Total), thanh tiến trình đổi màu theo mức tải bộ nhớ, nút truy cập nhanh Quản lý ứng dụng & Game Turbo.
            - ⏱️ Dashboard SOT 2 Cột: Bố cục trực quan hiển thị thời gian On-Screen và tổng thời lượng dùng máy kể từ khi rút sạc, cùng thông số sụt giảm pin chi tiết.
            - 🔋 Đồng Bộ & Bộ Lọc Danh Sách Hao Pin: Thêm bộ lọc linh hoạt [⚡ Từ lần rút sạc] và [📅 Hôm nay (24h)]. Tự động khắc phục lỗi rỗng danh sách khi vừa rút sạc dưới 10 phút. Bổ sung huy chương xếp hạng (🥇, 🥈, 🥉), thanh tỷ lệ SOT và ước tính % pin hao hụt của từng ứng dụng.
            - 🧩 Bộ Tiện Ích Màn Hình Chính (Home Screen Widgets):
              1. Widget SOT & Pin (2x1): Xem thời gian On-Screen và mức pin ngay trên màn hình chính, 1 chạm mở thẳng tab Pin trong app hoặc làm mới tức thì.
              2. Widget Dọn RAM 1-Chạm (1-Tap RAM Booster): Xem dung lượng RAM khả dụng và dọn dẹp tăng tốc siêu nhanh ngay từ màn hình chính mà không cần mở ứng dụng!
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
