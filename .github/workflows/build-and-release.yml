name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.15' }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.15' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.15' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.15' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật v1.0.15:
            - 🕒 Cho phép vuốt xóa/đóng thanh thông báo trạng thái bất cứ lúc nào.
            - ⚡ Mặc định bật sẵn thanh thông báo trạng thái giờ giây & pin khi khởi chạy.
            - 🔄 Bổ sung đầy đủ các khóa hệ thống đồng hồ giây cho HyperOS / MIUI.
            - 📢 Tối ưu nội dung thông báo cập nhật ngắn gọn, súc tích.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
