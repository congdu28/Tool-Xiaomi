name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.46}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 🔔 Trợ Lý Khắc Phục Trễ Thông Báo & Mở Khóa FCM / GMS Toàn Diện (Không Cần Khóa Đa Nhiệm):
              1. ⚡ Mở khóa đường truyền Google Play Services (GMS FCM Socket mtalk.google.com) hoạt động bền bỉ như máy ROM Quốc Tế.
              2. 🛡️ Tự động inject GMS và ứng dụng vào danh sách cấm đóng băng ngầm của HyperOS (MILLET_NO_RESTRICT_APP) & miễn trừ Doze mode vĩnh viễn.
              3. 🏦 Nhận diện và hỗ trợ riêng biệt toàn bộ App Ngân Hàng Việt Nam (Vietcombank, Techcombank, MB Bank, VPBank, BIDV, Cake...) & Gmail nhận biến động số dư OTT tức thì.
              4. 🔍 Tích hợp phím tắt kiểm tra trực tiếp trạng thái kết nối FCM (*#*#426#*#*) trong nháy mắt.
            - 🎮 Mini Game HUD Nổi (FPS & Hiệu Năng Thời Gian Thực):
              1. Lớp phủ nổi siêu nhẹ dạng Capsule kéo thả tự do trên màn hình khi chơi game (Liên Quân, Tốc Chiến, Genshin, PUBG...).
              2. Đo FPS thực tế & tần số quét màn hình (Choreographer VSYNC), theo dõi % CPU, % RAM, Nhiệt độ pin (°C) và Công suất xả pin (Watt).
              3. Chạm 1 lần để chuyển đổi linh hoạt giữa Chế độ Gọn (Compact) và Bảng điều khiển (Expanded).
              4. Tích hợp Quick Settings Tile "Game HUD FPS" bật/tắt nhanh từ thanh điều khiển.
            - 🚀 Xuất xưởng Release APK tối ưu hóa hiệu năng và độ ổn định.
          files: output-apks/*.apk
