name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.40}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 📱 Nâng Cấp Toàn Diện Trang Chính (Home Specs & Header):
              1. Căn chỉnh ô tên máy và huy hiệu Shizuku gọn gàng, thanh thoát, không còn bị ngắt dòng hay xô lệch chữ.
              2. Bổ sung thông tin Vi xử lý (CPU/SoC) chi tiết: Tên thương mại chip (Snapdragon/Dimensity), số nhân, xung nhịp tối đa (GHz) và kiến trúc 64-bit.
              3. Thông số Màn hình toàn diện: Kích thước (inch), độ phân giải chuẩn (FHD+/1.5K/2K), tần số quét (Hz), mật độ điểm ảnh (DPI), công nghệ tấm nền (AMOLED/HDR10+/Dolby Vision).
              4. Giám sát Bộ nhớ chuyên sâu: RAM vật lý, RAM mở rộng ảo / ZRAM (Swap HyperOS) và Bộ nhớ trong ROM kèm thanh tiến trình trực quan.
              5. Tình trạng Pin chi tiết: Hiển thị đầy đủ % pin, dung lượng định mức, dung lượng thực tế, chu kỳ sạc, nhiệt độ, điện áp và sức khỏe.
            - 🛡️ Thiết Kế Lại Tính Năng Gỡ Ứng Dụng Rác (Safe Debloater):
              1. Chuyển sang giao diện BottomSheet chuẩn phong cách HyperOS sang trọng, bo góc mềm mại, hiển thị rõ ràng từng ứng dụng.
              2. Sửa triệt để lỗi không nhận diện ứng dụng rác trên Android 11+ (bổ sung QUERY_ALL_PACKAGES).
              3. Thao tác đóng băng / khôi phục tức thì từng ứng dụng hoặc hàng loạt bằng 1 chạm qua Shizuku/Root.
            - 🌐 Tối Ưu Chuẩn Xác Tính Năng Private DNS:
              1. Sửa lỗi logic cấu hình DNS: Tự động (opportunistic), Tắt (off), AdGuard DNS, Cloudflare 1.1.1.1, Cloudflare Family và Google DNS.
              2. Bổ sung nút chuyển đổi tức thì và đồng bộ trạng thái thực tế.
            - 🚀 Xuất xưởng duy nhất 1 bản Release APK chuẩn tối ưu.
          files: output-apks/*.apk
