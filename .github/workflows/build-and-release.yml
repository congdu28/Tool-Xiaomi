name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.33}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ⏱️ Tối Ưu Giám Sát Pin & SOT Màn Hình:
              1. 💡 Dự đoán thời lượng pin còn lại (Battery Estimator): Tính toán thông minh thời gian On-screen lướt web và thời gian dùng hỗn hợp còn lại dựa trên tốc độ tiêu thụ thực tế (%/giờ).
              2. 📈 Biểu đồ sụt pin trực quan 24 giờ (Battery Drain History): Đồ thị đường cong Bezier mượt mà, trực quan theo từng mốc giờ, tự động phát hiện và cảnh báo khung giờ tụt pin ngầm (Wakelock).
              3. 🎨 Widget SOT chuẩn phong cách HyperOS Blur: Giao diện Glassmorphism trong suốt hiện đại, hiển thị đồng thời SOT + % Pin + Nhiệt độ hiện tại + Ước tính thời lượng còn lại.
            - ⚡ Đo Công Suất Sạc & Kiểm Tra Củ Cáp (Charging Tester):
              1. Đo công suất sạc thời gian thực (Watt = V x A) cập nhật mỗi giây.
              2. Tự động nhận diện chuẩn sạc: Mi Turbo Charge (33W - 120W+), Sạc nhanh QC/PD (18W - 27W), Sạc tiêu chuẩn (10W), Sạc chậm.
              3. Bài kiểm tra chất lượng củ cáp 10 giây: Đánh giá độ ổn định dòng điện, đo dòng nạp cực đại, xếp hạng sao (1 - 5⭐) và đưa ra chẩn đoán cáp chập chờn / suy hao / tiếp xúc kém.
            - 🚀 Xuất xưởng duy nhất 1 bản Release APK chuẩn tối ưu.
          files: |
            output-apks/Mi-Tool-*-Release.apk
