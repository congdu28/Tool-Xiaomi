name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.30}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ⏱️ Sửa Triệt Để Lỗi "Thời Gian Dùng Máy 497936 giờ": Khởi tạo an toàn mốc rút sạc ban đầu, loại bỏ hoàn toàn lỗi hiển thị epoch time khi người dùng chưa cắm rút sạc lần đầu.
            - 🔋 Chuẩn Hóa 100% Logic 2 Tab Tiêu Hao Pin:
              1. Tab [⚡ Từ lần rút sạc]: Ứng dụng công nghệ UsageEvents để đo chính xác từng giây thời gian hiển thị (Foreground Time) của từng app chỉ trong khoảng thời gian kể từ khi rút sạc đến hiện tại. Tổng thời gian các app luôn khớp chuẩn với thời gian SOT, không bao giờ bị lệch hay vượt quá SOT.
              2. Tab [📅 Hôm nay (24h)]: Tổng hợp toàn bộ hoạt động của tất cả ứng dụng từ 00:00 sáng hôm nay.
            - 📊 Tối Ưu Nhãn Hiển Thị: Chuyển đổi nhãn từ '% SOT' sang '% thời lượng' trực quan, kèm ước tính mức tiêu hao pin chuẩn xác theo tỷ lệ sử dụng.
            - 🚀 Tối Ưu Quy Trình Release: Chỉ đóng gói và phát hành duy nhất 1 bản Release chính thức, tối ưu dung lượng và tăng tốc thời gian build CI.
          files: |
            output-apks/Mi-Tool-*-Release.apk
