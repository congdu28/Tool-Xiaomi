name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee build_log.txt || {
            ERR=$(grep -E -i "error:|failed|exception|cause" build_log.txt | head -n 20 | tr '\r\n' ' ')
            echo "::error title=BuildFailure::$ERR"
            tail -n 80 build_log.txt
            exit 1
          }

      - name: Prepare APK Files
        run: |
          mkdir -p output-apks
          echo "=== Found APKs ==="
          find app/build/outputs/apk -type f -name "*.apk"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" output-apks/Tool-Xiaomi-Release.apk
            echo "Copied $RELEASE_APK to Tool-Xiaomi-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" output-apks/Tool-Xiaomi-Debug.apk
            echo "Copied $DEBUG_APK to Tool-Xiaomi-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tool-Xiaomi-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.5' }}

            Ứng dụng tiện ích tối ưu chuyên dụng cho điện thoại **Xiaomi, Redmi, POCO (MIUI / HyperOS)**.

            ### 🚀 Các tính năng chính:
            1. **Đồng hồ giây nổi (Floating Clock):**
               - Hiển thị thời gian thực `Giờ : Phút : Giây` (và tùy chọn mili-giây `.SS`).
               - Cửa sổ nổi tự do kéo thả, ghi nhớ vị trí, tùy chỉnh kích thước chữ, màu chữ và kiểu nền.
               - Tùy chọn khóa vị trí chống chạm nhầm và hiển thị % pin song song.
            2. **Ước lượng thời gian sạc & Giám sát pin thông minh:**
               - Tự động phát hiện khi cắm sạc (`AC Nhanh`, `USB`, `Không dây`).
               - Tính toán thời gian dự kiến sạc đầy (ETA) theo thuật toán mô phỏng đường cong sạc.
               - Đo công suất sạc tức thời (Watt), điện áp (V) và nhiệt độ pin (°C).
               - **Charging HUD (Viên thuốc Dynamic Island)** nổi 5 giây khi vừa cắm sạc.
            3. **Tiện ích cảnh báo âm thanh & rung:**
               - Báo chuông khi sạc đạt 80% (để bảo vệ tuổi thọ pin).
               - Báo khi pin đầy 100%.
               - Cảnh báo khi nhiệt độ pin quá nóng (> 42°C).
            4. **Trình hướng dẫn tối ưu đặc thù cho Xiaomi / HyperOS:**
               - 1-chạm mở cài đặt cấp quyền **Hiển thị trên ứng dụng khác** (Overlay).
               - 1-chạm mở cài đặt **Tự khởi chạy** (Autostart).
               - 1-chạm cấu hình **Tiết kiệm pin - Không giới hạn** (No restrictions).
               - 1-chạm mở cài đặt **Hiển thị trên màn hình khóa**.
               - Phím tắt mở trang thông tin pin ẩn của Xiaomi.

            ### 📦 Tải về cài đặt:
            - **Tool-Xiaomi-Release.apk**: Bản phát hành chính thức đã ký số.
            - **Tool-Xiaomi-Debug.apk**: Bản thử nghiệm.
          files: |
            output-apks/Tool-Xiaomi-Release.apk
            output-apks/Tool-Xiaomi-Debug.apk
