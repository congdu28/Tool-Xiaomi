name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.35}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ☀️ Tối Ưu Toàn Diện Giao Diện Sáng & Chuyển Đổi Theme (Light/Dark Mode):
              1. Khắc phục triệt để lỗi hiển thị khi chuyển sang giao diện sáng: Chữ sắc nét, độ tương phản cao, thẻ bài trắng tinh tế trên nền mát mẻ không bị lóa hay chìm màu.
              2. Các nút bấm và badge (chip nhãn): Tối ưu viền mảnh HyperOS, text đậm rõ ràng, loại bỏ toàn bộ các nền đen/xám tối bị lẫn màu trong theme sáng.
              3. Đổi theme mượt mà tức thì: Tự động lưu và giữ nguyên tab hiện tại khi chuyển đổi giữa Sáng / Tối / Hệ thống, không còn bị văng về tab đầu.
              4. Biểu đồ sụt pin (Battery Drain Chart) tự động nhận diện chế độ Sáng / Tối: Đường lưới và chữ trục thời gian hiển thị sắc nét trên cả hai giao diện.
            - 🔋 Tinh Chỉnh Bố Cục Pin & Sạc Gọn Gàng, Tinh Tế:
              1. Sắp xếp lại khối Cảm biến & Công suất sạc theo phong cách HyperOS hiện đại: Bỏ các khoảng cách thừa và đường kẻ divider dày, giúp giao diện gọn gàng, vừa vặn màn hình.
              2. Bố trí liền mạch: Dung lượng pin định mức, Dung lượng pin thực tế và Chu kỳ sạc được gom thành cụm thông số rõ ràng.
              3. Hàng nút đôi cân xứng: Tích hợp nút "🔌 Đo củ cáp (10s)" và "ℹ️ Thông tin bí mật CIT" nằm ngang cân đối, mở nhanh Menu CIT phần cứng và Thông tin pin ẩn.
            - 🚀 Xuất xưởng duy nhất 1 bản Release APK chuẩn tối ưu.
          files: |
            output-apks/Mi-Tool-*-Release.apk
