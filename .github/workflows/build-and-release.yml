name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.8' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.8' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.8' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.8' }}

            Bản cập nhật lớn tái cấu trúc giao diện và bổ sung tính năng tự động cập nhật:
            - 🧭 **Bố cục Bottom Navigation 3 Tab chuyên nghiệp:** Phân chia thành [Đồng Hồ] - [Pin & Sạc] - [Cài Đặt], xử lý triệt để lỗi tràn viền (Edge-to-Edge) và lỗi che khuất thông tin khi cuộn.
            - 🔄 **Tính năng Tự động kiểm tra bản cập nhật (In-App Updater):** App tự động kiểm tra bản mới từ GitHub khi mở, hoặc người dùng có thể bấm nút kiểm tra trong tab Cài đặt để tải và cài đặt trực tiếp file APK mà không cần vào trình duyệt.
            - 🏷️ **Tên file APK đính kèm phiên bản rõ ràng:** `Mi-Tool-v1.0.8-Release.apk` giúp dễ nhận biết và quản lý khi tải về.
            - 🕒 **Đồng hồ giây linh hoạt:** Hỗ trợ cả 3 cách: Bảng thông báo (100% không cần ADB/PC), Thanh trạng thái đỉnh máy (HyperOS Status Bar qua Shizuku/ADB) và Đồng hồ nổi kéo thả.
            - ⚡ **Tối ưu dung lượng siêu nhẹ (~2.0 MB):** Tích hợp R8 Proguard và Resource Shrinker.

            ### 📦 Tải về:
            - **Mi-Tool-v1.0.8-Release.apk**: Bản phát hành chính thức đã ký số.
            - **Mi-Tool-v1.0.8-Debug.apk**: Bản thử nghiệm.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
