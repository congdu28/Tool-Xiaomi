name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.26}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Report Failure to Release
        if: failure() && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Build Failed - Log
          body_path: gradle-build.log
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 📱 Màn hình chính Dashboard Cấu hình thiết bị: Khi mở app, hiển thị đầy đủ thông số phần cứng & hệ thống chuyên sâu (Model thiết bị, Tên mã thiết bị, Phiên bản Xiaomi HyperOS/MIUI, Android, Bản vá bảo mật, Bộ vi xử lý SoC/CPU Snapdragon/Dimensity, Kiến trúc, Màn hình độ phân giải/Tần số quét Hz/DPI, Dung lượng RAM & Bộ nhớ trong ROM kèm thanh tỷ lệ trực quan, Trạng thái pin & Nhiệt độ, cùng 4 phím tắt tối ưu nhanh).
            - 🗂️ Tái cấu trúc toàn bộ giao diện Tính năng theo chuẩn HyperOS: Gom gọn mỗi tính năng thành một mục riêng biệt (Card bo góc, icon tròn nổi bật, tiêu đề, dòng trạng thái trực tiếp và mũi tên điều hướng), bấm vào mở BottomSheet bảng điều khiển chuyên sâu.
            - ⚙️ Bộ tính năng chuyên biệt trong BottomSheet:
              + Tần số quét màn hình (60, 90, 120, 144Hz, Ép màn hình, Quick Settings Tile).
              + Mở khóa 120 FPS Game Turbo & Joyose (Fix drop fps Liên Quân, PUBG, Tắt Joyose qua Shizuku, Cấu hình tần số quét từng app).
              + Quản lý & Đóng băng ứng dụng rác (Safe Debloater Xiaomi 1-chạm không lo Bootloop).
              + Private DNS chặn quảng cáo toàn diện (AdGuard, Cloudflare).
              + Mở khóa VoLTE & VoWiFi Xiaomi (Fix lỗi mất sóng, mất cuộc gọi).
              + Giải phóng & Tối ưu RAM (Dọn dẹp đa nhiệm, quản lý RAM trống).
              + Đồng hồ giây & Capsule thông minh (Đồng hồ chính xác mili-giây, thông báo ngầm, capsule nổi trên màn hình).
              + Chuông cảnh báo & Hiệu ứng sạc HyperOS (Cảnh báo đầy/nóng, HUD Dynamic Island sạc HyperOS).
              + Tiện ích hệ thống Xiaomi (Dọn dẹp sâu Deep Clean, Menu kiểm tra phần cứng CIT ẩn, Tắt MSA quảng cáo).
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
