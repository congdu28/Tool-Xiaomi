name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.47}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - 🔔 **Thông Báo Bản Cập Nhật Mới Qua System Notification**:
              1. Tự động bắn thông báo hệ thống (Notification Drawer) khi phát hiện phiên bản mới từ GitHub Releases.
              2. Kèm bản xem trước nội dung cập nhật (Changelog) dạng BigTextStyle đẹp mắt.
              3. Chạm vào thông báo sẽ mở ngay hộp thoại cập nhật tải APK trực tiếp 1 chạm tiện lợi.
              4. Cơ chế kiểm tra định kỳ ngầm thông minh khi cắm sạc hoặc khởi động lại thiết bị (tần suất tối thiểu 6 giờ/lần), hoàn toàn không chạy ngầm gây hao pin hay nóng máy.
            - 🛡️ **Bộ Công Cụ Fix Trễ Thông Báo & FCM / GMS Cho ROM Nội Địa (HyperOS / MIUI)**:
              1. Mở khóa kết nối Google Play Services FCM Socket (mtalk.google.com) tương tự ROM Quốc Tế mà không cần khóa đa nhiệm (Lock recent apps).
              2. Khắc phục trễ OTT các App Ngân Hàng Việt Nam (Vietcombank, Techcombank, MB, BIDV, VPBank, Cake...) & Gmail.
              3. Phím tắt kiểm tra FCM Diagnostics (*#*#426#*#*).
            - 🎮 **Mini Game HUD Nổi (FPS & Giám Sát Hiệu Năng Thời Gian Thực)**:
              1. Hiển thị FPS thực tế (Choreographer VSYNC), CPU, RAM, Nhiệt độ pin (°C) và Công suất xả (Watt).
              2. Quick Settings Tile bật/tắt nhanh chóng.
            - 🚀 Xuất xưởng Release APK tối ưu hóa hiệu năng và độ ổn định.
          files: output-apks/*.apk
