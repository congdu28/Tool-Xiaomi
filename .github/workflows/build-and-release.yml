name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Determine Version Tag
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          else
            VER=$(grep "versionName" app/build.gradle | head -n 1 | awk -F"'" '{print $2}')
            TAG="v${VER:-1.0.56}"
          fi
          echo "TAG_NAME=${TAG}" >> $GITHUB_ENV
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Build APK (Release Only)
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease 2>&1 | tee gradle-build.log

      - name: Report Failure Log
        if: failure()
        run: |
          echo "### ❌ Build Failure Log" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 gradle-build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Build Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Mi Tool ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            Bản cập nhật ${{ env.TAG_NAME }}:
            - ⚡ **1-Chạm Mở Khóa Toàn Bộ 120 FPS Game (Tự Động Hóa Qua Shizuku)**:
              1. Tự động vô hiệu hóa dịch vụ Joyose ngầm của HyperOS/MIUI để gỡ bỏ triệt để giới hạn bóp 89 FPS trong Liên Quân Mobile, Tốc Chiến, PUBG.
              2. Tự động dọn dẹp và xóa sạch dữ liệu & cache của Pin & Hiệu suất (PowerKeeper) trực tiếp qua Shizuku mà không cần thao tác cài đặt thủ công.
              3. Tự động kích hoạt Speed Mode, ép màn hình cố định 120Hz và tắt cơ chế thermal_limit_refresh_rate chống tụt Hz khi nóng máy.
              4. Cập nhật huy hiệu trạng thái Joyose và tần số quét thời gian thực (real-time badge).
              5. Hộp thoại thông báo hoàn tất tự động hóa kèm nút mở game chiến ngay.
            - 🔄 **1-Chạm Khôi Phục Joyose & Màn Hình Mặc Định**:
              1. Phục hồi dịch vụ Joyose và đưa tần số quét màn hình về tự động (Auto) khi kết thúc chơi game.
            - 📋 **Minh Bạch Quy Trình Chuẩn 5 Bước**:
              1. Giao diện trực quan hóa từng bước độc lập: Kết nối Shizuku -> Quản lý Joyose -> Dọn dẹp PowerKeeper -> Ép 120Hz -> Khởi động Game & Mini Game HUD.
              2. Tự động phát hiện và gọi popup cấp quyền Shizuku; cập nhật giao diện thời gian thực (live).
            - 🎮 Tương thích hoàn hảo với Thư viện Game tùy chỉnh và Mini Game HUD nổi.
            - 🚀 Xuất xưởng Release APK ${{ env.TAG_NAME }} mượt mà, ổn định.
          files: output-apks/*.apk
