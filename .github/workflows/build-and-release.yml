name: Build and Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      
      - name: Install Android Platform & Build-Tools
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          set -o pipefail
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:assembleDebug

      - name: Prepare APK Files with Version
        run: |
          mkdir -p output-apks
          TAG_NAME="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.9' }}"
          RELEASE_APK=$(find app/build/outputs/apk -type f -name "*release*.apk" | head -n 1)
          DEBUG_APK=$(find app/build/outputs/apk -type f -name "*debug*.apk" | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
            echo "Copied $RELEASE_APK to output-apks/Mi-Tool-${TAG_NAME}-Release.apk"
          fi
          if [ -n "$DEBUG_APK" ]; then
            cp "$DEBUG_APK" "output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
            echo "Copied $DEBUG_APK to output-apks/Mi-Tool-${TAG_NAME}-Debug.apk"
          fi
          ls -la output-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Tool-APK
          path: output-apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.9' }}
          name: Mi Tool ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.9' }}
          draft: false
          prerelease: false
          make_latest: "true"
          token: ${{ secrets.GITHUB_TOKEN }}
          body: |
            ## 📱 Mi Tool (Tool Xiaomi) - Phiên bản ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.9' }}

            Bản cập nhật v1.0.9 tối ưu hóa hiệu năng, dung lượng siêu nhẹ và bổ sung kích hoạt Zero-ADB:
            - ⚡ **Tối ưu dung lượng siêu nhẹ & R8 FullMode:** Tinh gọn ProGuard rules, loại bỏ toàn bộ mã thừa từ thư viện Google Material, kích hoạt R8 Full Mode giúp file APK cực nhẹ, mượt mà và khởi động tức thì.
            - 🔋 **Tối ưu 0% tiêu hao pin khi tắt màn hình (Deep Sleep):** Tự động phát hiện khi tắt màn hình (`ACTION_SCREEN_OFF`) để tạm dừng ticker đồng hồ thông báo và đồng hồ nổi, đưa CPU về trạng thái ngủ sâu hoàn toàn, không tốn bất kỳ giọt pin nào khi khóa máy.
            - 🔓 **Kích hoạt Zero-ADB trực tiếp trên điện thoại:** Thêm nút cấp quyền "Sửa cài đặt hệ thống" (`WRITE_SETTINGS`) trực tiếp trên màn hình máy để thử kích hoạt giây trực tiếp vào `Settings.System` mà không cần máy tính hay ADB (tương tự cơ chế của Oppo/Honor).
            - 🧭 **Phím tắt mở Cài đặt Thanh trạng thái HyperOS:** Mở trực tiếp trang cài đặt gốc của Xiaomi chỉ với 1 chạm.
            - 🏷️ **Tên file APK chuẩn hóa theo phiên bản:** `Mi-Tool-v1.0.9-Release.apk`.
            - 🔄 **Cập nhật In-App Updater:** Tự động nhận diện và cập nhật lên bản v1.0.9 từ trong app.

            ### 📦 Tải về:
            - **Mi-Tool-v1.0.9-Release.apk**: Bản phát hành chính thức đã tối ưu hóa và ký số.
            - **Mi-Tool-v1.0.9-Debug.apk**: Bản kiểm thử.
          files: |
            output-apks/Mi-Tool-*-Release.apk
            output-apks/Mi-Tool-*-Debug.apk
